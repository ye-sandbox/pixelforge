name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup uv and Python 3.14
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Setup Node.js and TypeScript compiler
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install TypeScript compiler
        run: npm install -g typescript@5

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run pyright

      - name: Run tests
        run: uv run pytest

      - name: Run asset guards
        run: uv run pixelforge check

      - name: Validate generated TypeScript (tsc --noEmit)
        run: |
          TS_TMP="$(mktemp -d)"
          trap 'rm -rf "$TS_TMP"' EXIT
          uv run pixelforge render --emissive --lut --out "$TS_TMP/dist"
          uv run pixelforge render --indexed-ts --out "$TS_TMP/indexed"
          uv run pixelforge render --indexed-ts-lazy --out "$TS_TMP/indexed-lazy"
          tsc --noEmit --strict --noUncheckedIndexedAccess --noUnusedLocals --noUnusedParameters --isolatedModules --target ES2022 --module ESNext --moduleResolution bundler "$TS_TMP/dist/manifest.d.ts" "$TS_TMP/indexed"/*.ts
          tsc --noEmit --strict --noUncheckedIndexedAccess --noUnusedLocals --noUnusedParameters --isolatedModules --target ES2022 --module ESNext --moduleResolution bundler "$TS_TMP/indexed-lazy"/*.ts

      - name: Check git whitespace
        run: git diff-tree --check --root -m HEAD

  visual-critic:
    needs: ci
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup uv and Python 3.14
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run multimodal visual critic on changed assets
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://hydra-router.homelab.yegear.dev/v1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL_FAST: fast
        run: |
          if [ -z "${LLM_API_KEY:-}" ]; then
            echo "LLM_API_KEY secret not configured; skipping visual critic."
            exit 0
          fi
          BASE_REF="HEAD~1"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          fi
          uv run pixelforge critic --base "$BASE_REF" --threshold 70
