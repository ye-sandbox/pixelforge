[project]
name = "pixelforge"
version = "0.2.0"
description = "Deterministic Python compositional indexed pixel art compiler, guard suite, and Svelte 5 manifest exporter"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.0",
    "pillow>=13.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
pixelforge = "pixelforge.cli.main:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4.0",
    "pytest-socket>=0.8.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelforge"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "ANN",
    "ASYNC",
    "S",
    "T20",
    "DTZ",
    "TID",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--disable-socket", "--allow-unix-socket"]
